workflows:
  ios-manual-signing:
    name: iOS Manual Signing Workflow
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      groups:
        - Xcode Profile  
      vars:
        BUNDLE_ID: "com.eduardonova.soccerappios"
        XCODE_PROJECT: "ios/soccerappios.xcodeproj"  # Pointing inside the ios folder
        XCODE_SCHEME: "soccerappios"
        TEAM_ID: "798RNLXS99" 
      xcode: latest
    scripts:
      - name: Initialize keychain
        script: |
          keychain initialize
      - name: Set up provisioning profile
        script: |
          PROFILES_HOME="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILES_HOME"
          PROFILE_PATH="$PROFILES_HOME/$(uuidgen).mobileprovision"
          echo $CM_PROVISIONING_PROFILE | base64 --decode > "$PROFILE_PATH"
          echo "Provisioning profile saved to $PROFILE_PATH"
      - name: Add signing certificate to keychain
        script: |
          echo $CM_CERTIFICATE | base64 --decode > /tmp/certificate.p12
          keychain add-certificates --certificate /tmp/certificate.p12 --certificate-password $CM_CERTIFICATE_PASSWORD
      - name: Set up code signing settings on Xcode project
        script: |
          # Navigate into the ios directory to run profile configuration correctly
          cd ios && xcode-project use-profiles
      - name: Build iOS application
        script: |
          # Build the archive pointing to the project file inside the ios folder
          xcodebuild -project "$XCODE_PROJECT" \
                     -scheme "$XCODE_SCHEME" \
                     -sdk iphoneos \
                     -configuration Release \
                     archive -archivePath build/App.xcarchive \
                     CODE_SIGN_STYLE=Manual \
                     DEVELOPMENT_TEAM="$TEAM_ID"
          
          # Export the archive to an IPA file (referencing exportOptions.plist in the root)
          xcodebuild -exportArchive \
                     -archivePath build/App.xcarchive \
                     -exportOptionsPlist exportOptions.plist \
                     -exportPath build/output
    artifacts:
      - build/output/*.ipa