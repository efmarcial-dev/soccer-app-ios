workflows:
  ios-manual-signing:
    name: iOS Manual Signing Workflow
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      groups:
        - Xcode Profile  # Replace with the exact Environment Variable Group name you created in Codemagic
      vars:
        BUNDLE_ID: "com.eduardonova.soccerappios"  # Put your exact iOS app Bundle ID here
        XCODE_WORKSPACE: "project.xcworkspace"  # Or XCODE_PROJECT: "YourProject.xcodeproj"
        XCODE_SCHEME: "YourScheme"
      xcode: latest  # This uses a modern cloud Xcode version that supports the new code
    scripts:
      - name: Initialize keychain
        script: |
          keychain initialize
      - name: Set up provisioning profile
        script: |
          PROFILES_HOME="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILES_HOME"
          PROFILE_PATH="$PROFILES_HOME/$(uuidgen).mobileprovision"
          echo $CM_PROVISIONING_PROFILE | base64 --decode > "$PROFILE_PATH"
          echo "Provisioning profile saved to $PROFILE_PATH"
      - name: Add signing certificate to keychain
        script: |
          echo $CM_CERTIFICATE | base64 --decode > /tmp/certificate.p12
          keychain add-certificates --certificate /tmp/certificate.p12 --certificate-password $CM_CERTIFICATE_PASSWORD
      - name: Set up code signing settings on Xcode project
        script: |
          xcode-project use-profiles
      - name: Build iOS application
        script: |
          # If it's a standard workspace/project build:
          xcodebuild -workspace "$XCODE_WORKSPACE" \
                     -scheme "$XCODE_SCHEME" \
                     -sdk iphoneos \
                     -configuration Release \
                     archive -archivePath build/App.xcarchive \
                     CODE_SIGN_STYLE=Manual \
                     DEVELOPMENT_TEAM="YourTeamID"  # Optional if profiles map automatically
          
          # Export the archive to an IPA file
          xcodebuild -exportArchive \
                     -archivePath build/App.xcarchive \
                     -exportOptionsPlist exportOptions.plist \
                     -exportPath build/output
    artifacts:
      - build/output/*.ipa