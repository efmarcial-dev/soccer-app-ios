workflows:
  expo-ios-build:
    name: Expo iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      node: latest
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Prebuild Expo native project
        script: npx expo prebuild --platform ios
      - name: Build iOS app (IPA)
        script: |
          cd ios
          xcodebuild -workspace *.xcworkspace -scheme * -sdk iphoneos -configuration Release archive -archivePath build/App.xcarchive CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO
          xcodebuild -exportArchive -archivePath build/App.xcarchive -exportOptionsPlist ExportOptions.plist -exportPath build/ios/ipa
    artifacts:
      - ios/build/ios/ipa/*.ipa